name: Validate and deploy 1H Model

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh current-season public statistics before deployment
        type: boolean
        default: false
      refresh_lines:
        description: Refresh first-half lines and results without reimporting team statistics
        type: boolean
        default: false
      lab_method:
        description: Lab collection method to change (optional)
        type: choice
        default: none
        options: [none, enhanced-baseline-v2, enhanced-baseline-v1, baseline-control-v1, qualified-baseline-v1, first-half-defense-v1, bonus-exposure-v1]
      lab_action:
        description: Shared Lab collection action; previous records are retained
        type: choice
        default: keep
        options: [keep, enable, disable]
  schedule:
    - cron: "20 6,12,18 * * *"
      timezone: America/New_York
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  TZ: America/New_York

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      date: ${{ steps.policy.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.default_branch || github.ref }}
          sparse-checkout: |
            scripts/plan_refresh.py
            public/data/season-games.json
          sparse-checkout-cone-mode: false
      - name: Decide whether a line check is due
        id: policy
        env:
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
          REFRESH_DATA: ${{ inputs.refresh_data }}
          REFRESH_LINES: ${{ inputs.refresh_lines }}
        run: python scripts/plan_refresh.py
  build:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.default_branch || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install importer and Excel dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Refresh current season
        if: needs.plan.outputs.mode == 'full'
        run: python scripts/import_teamrankings.py --season 2026-27 --output public/data/current-season.json
      - name: Refresh first-half markets and results
        if: needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'markets'
        env:
          REFRESH_MODE: ${{ needs.plan.outputs.mode }}
          REFRESH_DATE: ${{ needs.plan.outputs.date }}
        run: |
          if [ "$REFRESH_MODE" = "markets" ]; then
            python scripts/import_season_games.py --start "$REFRESH_DATE" --through "$REFRESH_DATE"
          else
            python scripts/import_season_games.py
          fi
      - name: Update shared Lab collection setting
        if: github.event_name == 'workflow_dispatch' && inputs.lab_method != 'none' && inputs.lab_action != 'keep'
        env:
          LAB_METHOD: ${{ inputs.lab_method }}
          LAB_ACTION: ${{ inputs.lab_action }}
        run: python scripts/configure_lab.py --method "$LAB_METHOD" --action "$LAB_ACTION"
      - name: Collect reconciled first-half measurements for the Lab
        if: github.event_name != 'pull_request' && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'markets' || hashFiles('public/data/lab-halves.json') == '')
        run: python scripts/import_lab_halves.py
      # Context fits change only when observed outcome history changes.
      - name: Refresh venue and first-half context history
        if: github.event_name != 'pull_request' && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'markets')
        run: python scripts/import_context_history.py
      - name: Fit opponent-controlled context effects
        if: github.event_name != 'pull_request' && (needs.plan.outputs.mode == 'full' || needs.plan.outputs.mode == 'markets')
        run: python scripts/fit_game_context.py
      - name: Freeze pregame features and replay completed halves
        run: npm run audit:season
      - name: Check formatting and TypeScript rules
        run: npm run check
      - name: Test the model and public datasets
        run: npm test
      - name: Test the importer
        run: python -m pytest -q
      - name: Build app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Preserve validated predictions and the permanent record
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git add public/data
          if ! git diff --cached --quiet -- public/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: preserve predictions, markets, results and prediction record"
            git push origin HEAD:main
          fi
      - name: Upload site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
