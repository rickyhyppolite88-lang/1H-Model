name: Validate and deploy 1H Model

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh current-season public statistics before deployment
        type: boolean
        default: false
  schedule:
    - cron: "20 11,17,23 * 11,12,1,2,3,4 *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/New_York

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install importer test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Refresh current season
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: python scripts/import_teamrankings.py --season 2026-27 --output public/data/current-season.json
      - name: Refresh first-half markets and results
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: python scripts/import_season_games.py
      - name: Freeze pregame features and replay completed halves
        run: npm run audit:season
      - name: Check formatting and TypeScript rules
        run: npm run check
      - name: Test the model and public datasets
        run: npm test
      - name: Test the importer
        run: python -m pytest -q
      - name: Build app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Preserve a successfully validated data refresh
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        run: |
          if ! git diff --quiet -- public/data; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "data: refresh team stats, first-half markets and results"
            git push origin HEAD:main
          fi
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
